!
hostname R2
!
enable secret cisco123
!
no ip domain lookup
ip domain name lab.local
!
username admin privilege 15 secret cisco123
!
ip tcp synwait-time 5
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 2.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description Transit-to-R1-f0/0
 ip address 10.12.0.2 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface Ethernet1/0
 description OOB-Mgmt-to-Hub1
 ip address 172.20.40.212 255.255.255.0
 no shutdown
!
interface FastEthernet2/0
 description Core-to-R3-f0/0
 ip address 10.23.0.1 255.255.255.252
 ip ospf network point-to-point
 duplex full
 speed 100
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 2.2.2.2 0.0.0.0 area 0
 network 10.23.0.0 0.0.0.3 area 0
!
router bgp 65002
 no synchronization
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 3.3.3.3 remote-as 65002
 neighbor 3.3.3.3 update-source Loopback0
 neighbor 3.3.3.3 next-hop-self
 neighbor 10.12.0.1 remote-as 65001
 no auto-summary
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login local
 transport input telnet ssh
!
end